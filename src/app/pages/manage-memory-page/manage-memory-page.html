<div class="row mb-3">
  <div class="col-sm-8"><h3>Manage Memory</h3></div>
  <div class="col-sm-4 text-end">
    <a class="btn btn-outline-dark" title="Add New" [routerLink]="['/memory/','add', '']"   routerLinkActive="active"><i class="fa-solid fa-plus"></i></a>
  </div>
</div>

<div class="row mt-3">
  <div class="col-sm-4">
  @for (item of memorySvc.memories().memories; track $index) {
    <app-memory-details [memoryMeta]="item"></app-memory-details>
  } 
  </div>
</div>
