  <div class="card mb-3">

    <div class="card-header">
      <div class="form-check form-switch">
        <input id="enableMCPServer" title="Enable/Disable MCP Server" 
          [checked]="mcpConfig().enabled"
          (change)="toggle(mcpConfig().uuid)"
          class="form-check-input" type="checkbox" role="switch" >
        <label class="form-check-label" for="switchCheckDefault">{{ mcpConfig().name }}</label>
      </div>
    </div>

    <div class="card-body">

      @if (mcpConfig().command) {
        <p>Command: {{ mcpConfig().command }}</p>
      }

      @if (mcpConfig().url) {
        <p>URL: {{ mcpConfig().url }}</p>
      }

      <app-mcp-server-instance-details [mcpInstance]="mcpInstance()" [showToolForm]="true"></app-mcp-server-instance-details>

      <app-action-button
        buttonClass="btn btn-sm btn-primary"
        [action]="() => get(mcpConfig().uuid)"
        loadingText="Fetching...">
        Show Tools
      </app-action-button>
    </div>

  </div>
