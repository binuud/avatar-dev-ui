  <div class="card mb-3">
    <div class="card-header">
      {{ mcpConfig().name }} ( {{ mcpConfig().mcpType }} )
    </div>
    <div class="card-body">
      @if (mcpConfig().command) {
        <p>{{ mcpConfig().command }}</p>
      }
      @if (mcpConfig().url) {
        <p>{{ mcpConfig().url }}</p>
      }
      <app-mcp-server-instance-details [mcpInstance]="mcpInstance()"></app-mcp-server-instance-details>

      <app-action-button
        buttonClass="btn btn-primary"
        [action]="() => get(mcpConfig().uuid)"
        loadingText="Fetching...">
        Show Tools
      </app-action-button>
    </div>
  </div>
