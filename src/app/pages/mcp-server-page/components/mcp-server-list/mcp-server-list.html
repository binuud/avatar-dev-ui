<div class="row mb-3">
  <div class="col-sm-8"><h3>MCP Servers</h3></div>
  <div class="col-sm-4 text-end">
    <button class="btn btn-outline-dark" title="Add New" routerLink="/mcpServers/new"  routerLinkActive="active"><i class="fa-solid fa-plus"></i></button>
  </div>
</div>

@let servers = mcpManagerSvc.mcpServers().servers;
@for (item of servers ; track $index) {
  <app-mcp-server-detail [mcpConfig]="item"></app-mcp-server-detail>
}
