<div class="centerNarrowBlock responseArea">
  <app-chat-history></app-chat-history>
  <app-quantum-ai-camera (onEvent)="sendEvent($event)" [width]="640" [height]="480"></app-quantum-ai-camera>
</div>

<div class="fixed-bottom promptArea">
  <div class="fade-entire-div">

  </div>
  <div class="centerNarrowBlock promptInputArea">
    @if (aiSvc.state().connected) {
      <app-chat-prompt-input></app-chat-prompt-input>
    } @else {
      <app-connection-error-message></app-connection-error-message>
    }
  </div>
</div>
