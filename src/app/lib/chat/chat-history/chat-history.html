
@for (item of aiSvc.state().memory.contexts; track $index) {
  
  <div class="mb-3">
    <app-chat-response [context]="item" type="HISTORY"></app-chat-response>
  </div>

}

@if (!aiSvc.state().memory.contexts?.length) {
  <div class="row">
    <div class="col" style="height:30vh;">
    </div>
  </div>
}

@if (aiSvc.currentContext().in?.prompt) {
  <div id="currentContext">
    <app-chat-response [context]="aiSvc.currentContext()" type="ACTIVE" #scrollContainer></app-chat-response>
  </div>
}
