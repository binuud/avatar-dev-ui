@let a = avatar();
<div class="card mb-3">
  @if (a.meta?.image) {
    <img [src]="a.meta?.image"  class="card-img-top" alt="{{a.meta?.name}}">
  } @else {
    <img src="/static/avatarStore/placeholder.png"  class="card-img-top" alt="{{a.meta?.name}}">
  }

  <div class="card-body">
    <p><b>{{ a.meta?.name}}</b></p>
    <!-- (<small>{{ a.meta?.uuid}}</small>) -->
    <p class="card-text description">{{ a.meta?.description}}</p>

    @if (showLaunch()) {
      <a [routerLink]="['/avatar', a.meta?.name]" class="btn btn-sm btn-primary">Launch</a>
    }

  </div>
</div>
