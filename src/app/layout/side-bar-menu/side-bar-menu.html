<!-- Show this menu on larger form factor devices, like desktop and tablets -->
<div class="d-flex flex-column flex-shrink-0 bg-body-tertiary sidebar d-none d-md-flex" style="width: 4.5rem;">
    <a  href="/"  class="d-block py-3 link-body-emphasis text-decoration-none text-center" title="Home"  placement="right">
      <i class=" fa-soild fa-solid fa-house" [class]="loading ? 'fa-beat-fade loadingAnimate' : ''"></i>
      <span class="visually-hidden">Icon-only</span>
    </a>
    <ul class="nav nav-pills nav-flush flex-column mb-auto text-center iconMenu">
      <li>
        <a routerLink="/chat" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link py-3 border-bottom rounded-0" title="AI Chat" container="body" placement="right">
          <i class="fa-solid fa-comments" aria-label="AI Chat"></i>
        </a>
      </li>

      <li>
        <a routerLink="/avatar" routerLinkActive="active" ariaCurrentWhenActive="page" 
        class="nav-link py-3 border-bottom rounded-0" 
        title="Manage Avatars" container="body" placement="right">
          <i class="fa-solid fa-person-rays"></i>
        </a>
      </li>
    </ul>
    <ul class="nav nav-pills nav-flush flex-column text-center iconMenu">
      <li>
        <a routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link py-3 rounded-0 border-top" title="Settings"  container="body" placement="right">
          <i class="fa-solid fa-gear"></i>
        </a>
      </li>
    </ul>

    
</div>
