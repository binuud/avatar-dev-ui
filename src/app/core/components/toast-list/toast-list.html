<div
  class="toast-container position-fixed top-0 end-0 p-3"
  style="z-index: 1200;"
  aria-live="polite"
  aria-atomic="true">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast show align-items-center border-0 mb-2 text-bg-{{ toast.type }}"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      @if (toast.title) {
        <div class="toast-header">
          <strong class="me-auto">{{ toast.title }}</strong>
          <button
            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="toastService.remove(toast.id)"
          ></button>
        </div>
        <div class="toast-body">
          {{ toast.body }}
        </div>
      } @else {
        <div class="d-flex">
          <div class="toast-body">
            {{ toast.body }}
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            aria-label="Close"
            (click)="toastService.remove(toast.id)"
          ></button>
        </div>
      }
    </div>
  }
</div>
